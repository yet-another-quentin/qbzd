name: Bug report
description: Something in the Proxmox installation tooling is not working
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository only contains the Proxmox/LXC deployment scripts.

        **Playback problems, audio quality, Qobuz Connect behaviour, the HTTP
        API or the `qbzd setup` TUI belong upstream:**
        https://github.com/vicrodh/qbz/issues

        Report here only what concerns container creation, ALSA passthrough,
        the systemd unit, `qbzd-update`, or the DAC hotplug rule.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the problem.
    validations:
      required: true

  - type: dropdown
    id: script
    attributes:
      label: Which script
      options:
        - install/proxmox-lxc.sh
        - install/proxmox-dac-watch.sh
        - qbzd-update (inside the container)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact command line, with any environment overrides.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Script output
      description: Paste the relevant output. Redact your Qobuz credentials.
      render: shell

  - type: input
    id: pve_version
    attributes:
      label: Proxmox version
      placeholder: "e.g. PVE 8.2 — output of: pveversion"
    validations:
      required: true

  - type: input
    id: qbzd_version
    attributes:
      label: qbzd version
      placeholder: "e.g. v2.0.2 — output of: pct exec <CTID> -- qbzd --version"

  - type: dropdown
    id: audio
    attributes:
      label: AUDIO mode used
      options:
        - alsa
        - pipewire
        - none
    validations:
      required: true

  - type: input
    id: dac
    attributes:
      label: DAC
      placeholder: "e.g. Topping E30, connected over USB"

  - type: textarea
    id: journal
    attributes:
      label: Service log
      description: "Output of: pct exec <CTID> -- journalctl -u qbzd -n 50"
      render: shell
